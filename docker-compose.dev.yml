# Standalone dev compose — as close to prod as possible.
# Indexes /home/tom instead of /mnt/user, no auth required.
#
# Usage (app only):
#   docker compose -f docker-compose.dev.yml up -d --build nasearch
#
# Usage (run tests in a clean container, then tear everything down):
#   docker compose -f docker-compose.dev.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.dev.yml down

services:
  nasearch:
    build: .
    container_name: nasearch-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${DEV_DATA_PATH:-/home/tom}:/data:ro
      - ./index-dev:/index
    environment:
      - LOCATE_DB=/index/files.db
      - DATA_PATH=/data
      - PRUNE_PATHS=
      - MAX_RESULTS=500
      - NOAUTH=true

  tests:
    image: python:3.12-slim
    depends_on:
      - nasearch
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    environment:
      - NASEARCH_URL=http://nasearch:8000
    command: >
      sh -c "pip install --quiet -r requirements-dev.txt &&
             pytest -v"
    restart: "no"
