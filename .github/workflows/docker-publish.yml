name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - '.github/workflows/**'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Regression tests for reported bugs need conditions git can't store
      # (pre-1980 mtimes, directory names with spaces, >MAX_RESULTS matches).
      # Without this the fixture tree is absent and those tests skip, so a
      # green CI run would say nothing about the bugs they cover.
      - name: Generate regression fixtures
        run: sh tests/make_fixtures.sh "${{ runner.temp }}/nasearch-data"

      - name: Run tests
        run: docker compose -f docker-compose.dev.yml up --build --abort-on-container-exit --exit-code-from tests
        env:
          DEV_DATA_PATH: ${{ runner.temp }}/nasearch-data

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
